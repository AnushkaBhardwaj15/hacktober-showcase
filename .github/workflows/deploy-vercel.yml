name: Rebuild and Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "vercel-deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build validation & test suite
        run: npm run build

      - name: Trigger Vercel Deploy Hook
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: |
          echo "Triggering Vercel Deploy Hook..."
          response=$(curl -s -w "\n%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response: $body"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Successfully triggered Vercel rebuild!"
          else
            echo "Deploy hook returned HTTP $http_code"
            exit 1
          fi

      - name: Deploy via Vercel CLI (Production)
        if: env.VERCEL_DEPLOY_HOOK == '' && env.VERCEL_TOKEN != ''
        run: |
          echo "Deploying via Vercel CLI..."
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify Vercel Integration Status
        if: env.VERCEL_DEPLOY_HOOK == '' && env.VERCEL_TOKEN == ''
        run: |
          echo "Build validation passed!"
          echo "Note: If your repository is connected to Vercel via GitHub App Integration, Vercel automatically detects pushes to 'main' and initiates a rebuild & refresh."
          echo "To explicitly trigger or control deployments from GitHub Actions, add 'VERCEL_DEPLOY_HOOK' or 'VERCEL_TOKEN' (with VERCEL_ORG_ID and VERCEL_PROJECT_ID) to repository secrets."
