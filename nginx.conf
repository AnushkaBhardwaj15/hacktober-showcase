# Production Nginx Configuration for Hacktoberfest Showcase
# Suitable for standalone Docker container or behind an Application Load Balancer (ALB / Cloudflare)

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check for Load Balancer / Kubernetes Liveness Probe
    location = /health.html {
        access_log off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =200;
    }

    # Immutable media and fonts (1 year cache)
    location ~* \.(webp|jpeg|jpg|png|gif|svg|woff2|woff|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Stylesheets and Javascript (30 days with revalidation)
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
        try_files $uri =404;
    }

    # HTML Documents (1 hour cache, stale-while-revalidate)
    location / {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        try_files $uri $uri/ /index.html;
    }
}
